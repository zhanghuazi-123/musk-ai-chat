<!-- 马斯克AI对话App - 前端界面 -->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Talk with Elon - 与马斯克对话</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div id="app">
        <!-- 头部 -->
        <header class="header">
            <div class="header-content">
                <div class="logo">
                    <span class="logo-icon">🚀</span>
                    <h1>Talk with Elon</h1>
                </div>
                <div class="header-info">
                    <span class="model-badge" id="modelBadge">Model: Loading...</span>
                    <button class="btn-icon" id="btnConfig" title="API配置">⚙️</button>
                    <button class="btn-icon" id="btnClear" title="清空对话">🗑️</button>
                </div>
            </div>
        </header>

        <!-- 主聊天区域 -->
        <main class="chat-container">
            <div class="chat-messages" id="chatMessages">
                <!-- 欢迎消息 -->
                <div class="message system-message">
                    <div class="message-avatar">🤖</div>
                    <div class="message-content">
                        <div class="message-sender">System</div>
                        <div class="message-text">
                            <p>欢迎来到 <strong>Talk with Elon</strong>！</p>
                            <p>在这里，你可以与基于埃隆·马斯克人格训练的AI进行对话。</p>
                            <p>💡 <strong>提示</strong>：马斯克以直率、技术导向和偶尔的争议性观点闻名。试试问他关于火星、AI、特斯拉或他的人生经历吧！</p>
                            <div class="quote-box" id="quoteBox">
                                <p class="quote-text">"Loading quote..."</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 输入区域 -->
            <div class="chat-input-container">
                <div class="chat-input-wrapper">
                    <textarea 
                        id="userInput" 
                        placeholder="输入你的消息...（按 Enter 发送，Shift+Enter 换行）"
                        rows="1"
                    ></textarea>
                    <button class="btn-send" id="btnSend">
                        <span class="send-icon">➤</span>
                    </button>
                </div>
                <div class="input-hints">
                    <span class="hint">Try: "你对AI安全有什么看法？"</span>
                </div>
            </div>
        </main>

        <!-- API配置面板 -->
        <div class="config-panel" id="configPanel">
            <div class="config-content">
                <div class="config-header">
                    <h3>⚙️ API 配置</h3>
                    <button class="btn-icon" id="btnCloseConfig">✕</button>
                </div>
                <div class="config-body">
                    <div class="config-group">
                        <label for="inputApiKey">API Key <span class="required">*</span></label>
                        <input type="password" id="inputApiKey" placeholder="sk-..." />
                        <small>你的API密钥（将保存在本地浏览器中）</small>
                    </div>
                    <div class="config-group">
                        <label for="inputBaseUrl">Base URL</label>
                        <input type="text" id="inputBaseUrl" placeholder="https://dashscope.aliyuncs.com/compatible-mode/v1" />
                        <small>API基础URL（默认：阿里百炼）</small>
                    </div>
                    <div class="config-group">
                        <label for="inputModel">Model</label>
                        <input type="text" id="inputModel" placeholder="kimi-k2.5" />
                        <small>模型名称（默认：kimi-k2.5）</small>
                    </div>
                    <div class="config-actions">
                        <button class="btn-save" id="btnSaveConfig">💾 保存配置</button>
                        <button class="btn-test" id="btnTestConfig">🧪 测试连接</button>
                    </div>
                    <div class="config-status" id="configStatus"></div>
                </div>
            </div>
        </div>

        <!-- 侧边栏（可选，用于显示对话历史） -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <h3>对话历史</h3>
                <button class="btn-icon" id="btnCloseSidebar">✕</button>
            </div>
            <div class="sidebar-content" id="chatHistory">
                <p class="empty-hint">暂无历史对话</p>
            </div>
        </aside>
    </div>

    <script src="app.js"></script>
</body>
</html>
